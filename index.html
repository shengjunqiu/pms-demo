<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="项目管理平台 - 企业四算与项目全生命周期管理" />
    <meta name="theme-color" content="#1d4ed8" />
    <title>项目管理平台 - 企业四算与项目全生命周期管理</title>
    <link rel="preconnect" href="https://api.dicebear.com" />
    <link rel="dns-prefetch" href="https://api.dicebear.com" />
    <style>
      /* 首屏骨架屏：在 JS 加载完成前显示，避免白屏 */
      .pms-splash {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100vh; background: #f7f9fc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .pms-splash-logo { width: 48px; height: 48px; background: linear-gradient(135deg, #2563eb, #1d4ed8); border-radius: 12px; margin-bottom: 20px; }
      .pms-splash-bar { height: 4px; width: 160px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
      .pms-splash-bar::after { content: ''; display: block; height: 100%; width: 40%; background: #2563eb; border-radius: 4px; animation: pms-splash-loading 1.2s ease-in-out infinite; }
      @keyframes pms-splash-loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pms-splash">
        <div class="pms-splash-logo"></div>
        <div class="pms-splash-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
